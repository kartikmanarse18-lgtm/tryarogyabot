name: Build Android APK

# Runs on every push to main, on version tags (v1.0.0 → also creates a GitHub Release with the APK),
# and manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      # The android/ folder is not stored in git — it is generated fresh every build,
      # then ArogyaBot's manifest/permissions/signing/icons are applied on top.
      - name: Generate Android project
        run: |
          npx cap add android
          pip install --quiet pillow
          python3 scripts/patch-android.py
          python3 scripts/make-android-icons.py

      # Optional: remote push (FCM). Add the file's contents as repo secret GOOGLE_SERVICES_JSON.
      # When the secret exists the app is also built with NATIVE_PUSH_ENABLED = true automatically
      # (turning it on without the file would crash the app, so the two always go together).
      - name: Firebase config for push (optional)
        env: { GSJ: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" > android/app/google-services.json
            sed -i 's/const NATIVE_PUSH_ENABLED = false;/const NATIVE_PUSH_ENABLED = true;/' www/js/config/app-config.js
            grep -n "NATIVE_PUSH_ENABLED" www/js/config/app-config.js
            echo "Remote push ENABLED in this build"
          else
            echo "No GOOGLE_SERVICES_JSON secret — building WITHOUT remote push (reminders + in-app alerts still work)"
          fi

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # Signed build if a keystore secret exists (updates install over old versions), otherwise a debug build.
      - name: Keystore (optional)
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "SIGNED=1" >> $GITHUB_ENV
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.{0}', github.run_number) }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../ArogyaBot.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../ArogyaBot.apk
          fi

      - uses: actions/upload-artifact@v4
        with: { name: ArogyaBot-apk, path: ArogyaBot.apk }

      - name: Attach to GitHub Release (tags only)
        if: github.ref_type == 'tag'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "${{ github.ref_name }}" ArogyaBot.apk --title "ArogyaBot ${{ github.ref_name }}" --generate-notes

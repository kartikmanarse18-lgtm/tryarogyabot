name: Build Android APK

# Runs when NATIVE-app files change on main, on version tags (v1.0.0 → also creates a GitHub Release with the APK),
# and manually from the Actions tab ("Run workflow").
#
# WHY THE PATH FILTER: the APK is only a shell that loads the live website (see "Point the app at the live website"
# below), so changing the web app (index.html, js/, css/, sw.js, tests/, docs/, worker-abdm/) never needs a new APK —
# users get it as soon as GitHub Pages deploys. Only changes that alter the native shell trigger a build here.
# Need an APK anyway? Actions tab → "Build Android APK" → "Run workflow".
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'icons/**'
      - '.github/workflows/android-apk.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a Release

# One build per branch/tag at a time, so two quick pushes can't fight over the rolling release below.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04   # pinned: "ubuntu-latest" moves to Ubuntu 26 on 19 Oct 2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      # LIVE UPDATES: the app loads your website (GitHub Pages) instead of a bundled copy, so anything you
      # commit to the repo shows up for users automatically. Default URL = https://<owner>.github.io/<repo>/
      # Custom domain or different URL? Add a repo VARIABLE named APP_URL (Settings > Secrets and variables > Actions > Variables).
      - name: Point the app at the live website
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          URL="${APP_URL:-https://$OWNER.github.io/${{ github.event.repository.name }}/}"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));c.server={url:process.argv[1],cleartext:false};fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));" "$URL"
          echo "App will load from: $URL"

      # The android/ folder is not stored in git — it is generated fresh every build,
      # then ArogyaBot's manifest/permissions/signing/icons are applied on top.
      - name: Generate Android project
        run: |
          npx cap add android
          pip install --quiet pillow
          python3 scripts/patch-android.py
          python3 scripts/make-android-icons.py

      # Optional: remote push (FCM). Add the file's contents as repo secret GOOGLE_SERVICES_JSON.
      # With the secret, the build also adds the marker "ArogyaBotPush" to the app's user-agent, which is what switches
      # NATIVE_PUSH_ENABLED on in js/config/app-config.js (push without the file would crash the app, so the two go together).
      # NOTE: the app loads the LIVE website, so editing a copy of app-config.js inside the APK would have no effect.
      - name: Firebase config for push (optional)
        env: { GSJ: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" > android/app/google-services.json
            node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));c.appendUserAgent='ArogyaBotPush';fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
            echo "Remote push ENABLED in this build (user-agent marker added)"
          else
            echo "No GOOGLE_SERVICES_JSON secret — building WITHOUT remote push (reminders + in-app alerts still work)"
          fi

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # Signed build if a keystore secret exists (updates install over old versions), otherwise a debug build.
      - name: Keystore (optional)
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "SIGNED=1" >> $GITHUB_ENV
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.{0}', github.run_number) }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../ArogyaBot.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../ArogyaBot.apk
          fi

      - uses: actions/upload-artifact@v4
        with: { name: ArogyaBot-apk, path: ArogyaBot.apk }

      # PUBLIC DOWNLOAD LINK. Workflow artifacts need a GitHub login to download, so they can't be given to users.
      # Release files are public. Every push to main (signed builds only — a debug build has a different key each time and
      # could never update an installed app) refreshes ONE rolling release tagged `android-latest`. The app's
      # "Get the Android app" icon reads this release (js/services/apk-download.js).
      - name: Publish rolling public release "android-latest" (main branch, signed builds only)
        if: github.ref_type == 'branch' && github.ref_name == 'main' && env.SIGNED == '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          SHA=$(sha256sum ArogyaBot.apk | cut -d' ' -f1)
          VER="0.1.${{ github.run_number }}"
          printf 'Version: %s\nBuild: %s\nCommit: %s\nSHA-256: %s\n\nSigned Android build of ArogyaBot. Download ArogyaBot.apk below.\n' "$VER" "${{ github.run_number }}" "${GITHUB_SHA:0:7}" "$SHA" > release-notes.txt
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest ArogyaBot.apk --prerelease --target "$GITHUB_SHA" --title "ArogyaBot Android (latest build)" --notes-file release-notes.txt

      - name: Attach to GitHub Release (tags only)
        if: github.ref_type == 'tag'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "${{ github.ref_name }}" ArogyaBot.apk --title "ArogyaBot ${{ github.ref_name }}" --generate-notes
